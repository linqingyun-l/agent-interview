spring:
  application:
    name: agentInterview
  profiles:
    active: dev
  # Jackson 通用配置（公共）
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # Multipart 上传限制（公共）
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ================================
# 应用自定义配置（公共）
# ================================
app:
  ai:
    default-provider: dashscope
  interview:
    follow-up-count: 1                # 每题追问数
    evaluation-batch-size: 8          # 评估分批大小
    default-total-minutes: 30         # 默认面试总时长
  rate-limit:
    enabled: true
  encryption:
    api-key-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:change_me_in_production}

# ================================
# Server（顶层 key，非 spring.server）
# ================================
server:
  port: 8123
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    max-swallow-size: 100MB
    max-http-request-header-size: 64KB

# ================================
# SpringDoc OpenAPI（顶层 key）
# ================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ================================
# 日志（顶层 key）
# ================================
logging:
  level:
    root: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: INFO
