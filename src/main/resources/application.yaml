spring:
  application:
    name: agentInterview
  profiles:
    active: dev
    jackson:
      default-property-inclusion: non_null
      date-format: yyyy-MM-dd HH:mm:ss
      time-zone: Asia/Shanghai

  server:
    port: 8123
    servlet:
      encoding:
        charset: UTF-8
        enabled: true
        force: true
    tomcat:
      max-swallow-size: 100MB
    max-http-request-header-size: 64KB

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs

  # ================================
  # 数据源
  # ================================
  spring.datasource:
    url: jdbc:postgresql://localhost:5432/agent_interview
    username: lwk
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ================================
  # JPA
  # ================================
  spring.jpa:
    hibernate:
      ddl-auto: validate            # ⚠️ 禁止 create！schema 由 Flyway 管理
    open-in-view: false             # ⚠️ 禁止 OSIV（避免懒加载坑）
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true

  # ================================
  # Flyway
  # ================================
  spring.flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ================================
  # Redis
  # ================================
  spring.data.redis:
    host: localhost
    port: 6379
    timeout: 5s
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2

  # ================================
  # Spring AI（自定义 Provider 见 02-common-ai）
  # ================================
  spring.ai:
    openai:
      api-key: ${AI_BAILIAN_API_KEY:dummy}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: ${AI_MODEL:qwen3.5-flash}
    vectorstore:
      pgvector:
        initialize-schema: false   # ⚠️ 必须 false，schema 由 Flyway 管理
        dimensions: 1024           # 与 Flyway 建表保持一致
        distance-type: COSINE

  # ================================
  # 应用自定义配置
  # ================================
  app:
    ai:
      default-provider: dashscope
      providers:
        dashscope:
          base-url: https://dashscope.aliyuncs.com/compatible-mode
          api-key: ${AI_BAILIAN_API_KEY}
          chat-model: ${AI_MODEL:qwen3.5-flash}
          embedding-model: text-embedding-v3
          embedding-dimensions: 1024
    storage:
      endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
      region: us-east-1
      access-key: ${APP_STORAGE_ACCESS_KEY:rustfsadmin}
      secret-key: ${APP_STORAGE_SECRET_KEY:rustfsadmin}
      bucket: ${APP_STORAGE_BUCKET:interview-guide}
      path-style-access: true
    interview:
      follow-up-count: 1                # 每题追问数
      evaluation-batch-size: 8          # 评估分批大小
      default-total-minutes: 30         # 默认面试总时长
    rate-limit:
      enabled: true
    encryption:
      api-key-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:change_me_in_production}

  # ================================
  # 日志
  # ================================
  logging:
    level:
      root: INFO
      com.example.interviewguide: DEBUG
      org.springframework.ai: INFO
      org.hibernate.SQL: INFO
